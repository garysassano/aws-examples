[workspace]
members = [
    "src/functions/app-backend",
    "src/functions/app-frontend",
    "src/functions/client-rust",
    "src/functions/client-rust-wide",
    "src/functions/otlp-forwarder",
    "src/layers/otlp-stdout-kinesis-extension",
]

resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.94.1"

[workspace.dependencies]
# Serverless OTLP forwarder libraries. They build on OpenTelemetry 0.31, which
# sets the OpenTelemetry versions below.
lambda-lw-http-router = "0.6.0"
lambda-otel-lite = "0.19.1"
otlp-stdout-span-exporter = "0.17.1"
serverless-otlp-forwarder-core = { version = "0.2.1", features = ["instrumented-client"] }

# AWS
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-credential-types = "1.3.0"
aws-sdk-dynamodb = { version = "1.128.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-kinesis = { version = "1.124.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws_lambda_events = { version = "1.2.0", default-features = false, features = ["apigw"] }
aws-sigv4 = "1.6.0"
lambda-extension = "1.1.1"
lambda_runtime = "1.4.0"
serde_dynamo = { version = "4.3.0", features = ["aws-sdk-dynamodb+1"] }

# OpenTelemetry and tracing
opentelemetry = { version = "0.31.0", features = ["trace"] }
opentelemetry-otlp = { version = "0.31.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls-webpki-roots", "trace"] }
opentelemetry-proto = { version = "0.31.0", default-features = false, features = ["gen-tonic-messages", "trace"] }
opentelemetry-semantic-conventions = { version = "0.31.0", features = ["semconv_experimental"] }
opentelemetry_sdk = { version = "0.31.0", default-features = false, features = ["trace"] }
reqwest-tracing = { version = "0.7.1", features = ["opentelemetry_0_31"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.32.1"

# HTTP
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
reqwest-middleware = "0.5.2"

# Runtime and utilities
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
flate2 = "1.1.10"
nix = { version = "0.31.3", features = ["fs"] }
prost = "0.14.4"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tera = "2.4.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
