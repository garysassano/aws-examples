<svg xmlns="http://www.w3.org/2000/svg" width="912" height="370" viewBox="-16 -16 912 370" role="img" aria-labelledby="title description">
<title id="title">Cold start timings with and without SOCI</title>
<desc id="description">Stacked bars of the median run per variant, phases in the order they happen. Fargate plain-init: ready 81.2 s (platform 10.3, image 69.7, load 1.2, waiting 0.0); Fargate soci-init: ready 23.2 s (platform 9.9, image 3.7, load 9.6, waiting 0.0); LMI plain-init: ready 121.5 s (platform 40.0, image 65.3, load 2.0, waiting 14.2); LMI soci-init: ready 81.6 s (platform 40.4, image 9.8, load 18.9, waiting 12.5); LMI plain-handler: ready 122.7 s (platform 40.0, image 66.7, load 1.1, waiting 14.9); LMI soci-handler: ready 80.5 s (platform 40.0, image 10.2, load 18.8, waiting 11.4).</desc>
<style>
svg { --surface: #fcfcfb; --text: #0b0b0b; --muted: #52514e; --grid: #e4e3df; --platform: #85847f; --image: #2a78d6; --load: #eb6834; --hatch: #85847f; }
@media (prefers-color-scheme: dark) {
  svg { --surface: #1a1a19; --text: #f0efec; --muted: #c3c2b7; --grid: #34332f; --platform: #6e6d68; --image: #3987e5; --load: #d95926; --hatch: #8a8984; }
}
text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 13px; }
.bg { fill: var(--surface); }
.txt { fill: var(--text); }
.muted { fill: var(--muted); }
.head { font-weight: 600; }
.total { font-weight: 600; font-variant-numeric: tabular-nums; }
.total .muted { font-weight: 400; }
.tick { font-size: 12px; font-variant-numeric: tabular-nums; }
.inside { fill: #fff; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
.grid { stroke: var(--grid); stroke-width: 1; }
.hatch-bg { fill: var(--surface); }
.hatch-line { stroke: var(--hatch); stroke-width: 1.5; }
</style>
<defs>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect class="hatch-bg" width="6" height="6"/><line class="hatch-line" x1="0" y1="0" x2="0" y2="6"/>
</pattern>
</defs>
