[project]
name = "detect-labels-model"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "boto3==1.43.120",
  "pillow==13.0.0",
  "torch==2.14.1",
  "torchvision==0.29.1",
  "transformers==5.21.0",
]

[tool.uv]
exclude-newer = "3 days"
# The image runs on x86_64 Linux only, so the lock needs no other platforms.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# The CPU builds of PyTorch are a fraction of the size of the default CUDA builds, and Serverless
# Inference has no GPUs.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
