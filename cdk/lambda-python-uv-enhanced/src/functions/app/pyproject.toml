[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aws-lambda-powertools[parser]>=3.35.0",
    "report",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12.22"
# Dependency cooldown: like pnpm's minimumReleaseAge, skip releases younger than 3 days.
exclude-newer = "3 days"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
report = { workspace = true }
