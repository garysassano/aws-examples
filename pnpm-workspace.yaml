packages:
  - "cdk/*"
  - "cdktn/*"
  - "sst/*"
  # Client apps that ship inside an example, such as a demo CLI or web UI.
  - "cdk/*/src/demo/*"

# Shared versions. Examples reference these as `catalog:`; a dependency only one
# example uses stays pinned in that example's package.json.
catalog:
  astro: ^7.3.4
  astro-sst: ^3.1.4
  "@astrojs/check": ^0.9.10
  "@astrojs/preact": ^6.0.5
  "@astrojs/rss": ^4.0.19
  aws-cdk: ^2.1142.0
  aws-cdk-lib: ^2.270.0
  # Alpha modules ship in lockstep with aws-cdk-lib; bump them together.
  "@aws-cdk/aws-apprunner-alpha": 2.270.0-alpha.0
  "@aws-cdk/aws-lambda-python-alpha": 2.270.0-alpha.0
  "@aws-cdk/aws-pipes-alpha": 2.270.0-alpha.0
  "@aws-cdk/aws-pipes-enrichments-alpha": 2.270.0-alpha.0
  "@aws-cdk/aws-pipes-sources-alpha": 2.270.0-alpha.0
  "@aws-cdk/aws-pipes-targets-alpha": 2.270.0-alpha.0
  "@aws-lambda-powertools/event-handler": ^2.35.0
  "@aws-lambda-powertools/idempotency": ^2.35.0
  "@aws-lambda-powertools/jmespath": ^2.35.0
  "@aws-lambda-powertools/logger": ^2.35.0
  "@aws-lambda-powertools/parser": ^2.35.0
  "@aws-sdk/client-bedrock-runtime": ^3.1138.0
  "@aws-sdk/client-dynamodb": ^3.1138.0
  "@aws-sdk/client-ecs": ^3.1138.0
  "@aws-sdk/client-rekognition": ^3.1138.0
  "@aws-sdk/client-s3": ^3.1138.0
  "@aws-sdk/client-sns": ^3.1138.0
  "@aws-sdk/client-sqs": ^3.1138.0
  "@aws-sdk/client-ssm": ^3.1138.0
  "@aws-sdk/lib-dynamodb": ^3.1138.0
  "@aws-sdk/s3-request-presigner": ^3.1138.0
  "@biomejs/biome": ^2.5.14
  cargo-lambda-cdk: ^0.0.36
  cdktn: ^0.24.0
  cdktn-cli: ^0.24.0
  # cdktn 0.24 peers on constructs ">=10.6.0 <10.8.0"; 0.25 widens it to ^10.6.0.
  # aws-cdk-lib accepts ^10.5.0, so one version serves both.
  constructs: ~10.7.2
  "@dev7a/lambda-otel-lite": ^0.16.3
  esbuild: ^0.28.2
  "@middy/core": ^7.9.2
  "@middy/event-normalizer": ^7.9.2
  "@middy/http-error-handler": ^7.9.2
  "@opentelemetry/api": ^1.9.1
  "@opentelemetry/core": ^2.11.0
  "@opentelemetry/exporter-trace-otlp-http": ^0.222.0
  "@opentelemetry/instrumentation": ^0.222.0
  "@opentelemetry/instrumentation-aws-sdk": ^0.77.0
  "@opentelemetry/instrumentation-http": ^0.222.0
  "@opentelemetry/instrumentation-undici": ^0.32.0
  "@opentelemetry/otlp-exporter-base": ^0.222.0
  "@opentelemetry/resource-detector-aws": ^2.22.0
  "@opentelemetry/resources": ^2.11.0
  "@opentelemetry/sdk-trace-base": ^2.11.0
  "@opentelemetry/sdk-trace-node": ^2.11.0
  "@opentelemetry/semantic-conventions": ^1.43.0
  sst: ^4.17.1
  tsx: ^4.23.15
  "@types/aws-lambda": ^8.10.163
  "@types/node": ^26.6.2
  typescript: ^7.0.2
  uv-python-lambda: ^0.0.7
  vitest: ^5.0.1
  yaml: ^2.9.1
  zod: ^4.6.5

allowBuilds:
  esbuild: true
  # Its postinstall only checks versions for the optional protobufjs CLI;
  # nothing that loads protobufjs at runtime depends on it.
  protobufjs: false
  # Prebuilt binaries arrive as optional @img/sharp-* packages; the install
  # script only matters when building sharp from source.
  sharp: false

minimumReleaseAge: 4320
minimumReleaseAgeStrict: true

# mise owns the package-manager binary.
pmOnFail: ignore
