packages:
  - "cdk/*"
  - "cdktn/*"
  # Client apps that ship inside an example, such as a demo CLI or web UI.
  - "cdk/*/src/demo/*"
  - "cdk/*/src/website"

# Shared versions. Examples reference these as `catalog:`; a dependency only one
# example uses stays pinned in that example's package.json.
catalog:
  aws-cdk: ^2.1146.1
  aws-cdk-lib: ^2.275.0
  # Alpha modules ship in lockstep with aws-cdk-lib; bump them together.
  "@aws-cdk/aws-apprunner-alpha": 2.275.0-alpha.0
  "@aws-cdk/aws-lambda-python-alpha": 2.275.0-alpha.0
  "@aws-cdk/aws-pipes-alpha": 2.275.0-alpha.0
  "@aws-cdk/aws-pipes-sources-alpha": 2.275.0-alpha.0
  "@aws-cdk/aws-pipes-targets-alpha": 2.275.0-alpha.0
  "@aws-lambda-powertools/event-handler": ^2.35.0
  "@aws-lambda-powertools/idempotency": ^2.35.0
  "@aws-lambda-powertools/jmespath": ^2.35.0
  "@aws-lambda-powertools/logger": ^2.35.0
  "@aws-lambda-powertools/parser": ^2.35.0
  "@aws-sdk/client-bedrock-runtime": ^3.1148.0
  "@aws-sdk/client-dynamodb": ^3.1148.0
  "@aws-sdk/client-ecs": ^3.1148.0
  "@aws-sdk/client-rekognition": ^3.1148.0
  "@aws-sdk/client-s3": ^3.1148.0
  "@aws-sdk/client-sagemaker-runtime": ^3.1148.0
  "@aws-sdk/client-sns": ^3.1148.0
  "@aws-sdk/client-sqs": ^3.1148.0
  "@aws-sdk/client-ssm": ^3.1148.0
  "@aws-sdk/lib-dynamodb": ^3.1148.0
  # Pinned to the version the other @aws-sdk/client-* entries resolve to: it depends on the same
  # version of client-s3 exactly, and a newer one would install a second, incompatible client-s3.
  "@aws-sdk/s3-presigned-post": 3.1148.0
  "@biomejs/biome": ^2.5.15
  cargo-lambda-cdk: ^0.0.36
  cdktn: ^0.25.0
  cdktn-cli: ^0.25.0
  # cdktn peers on ^10.6.0 and aws-cdk-lib on ^10.5.0, so one version serves both.
  constructs: ^10.8.1
  "@dev7a/lambda-otel-lite": ^0.16.3
  esbuild: ^0.28.2
  "@middy/core": ^7.9.2
  "@middy/event-normalizer": ^7.9.2
  "@middy/http-error-handler": ^7.9.2
  "@opentelemetry/api": ^1.9.1
  "@opentelemetry/core": ^2.11.0
  "@opentelemetry/exporter-trace-otlp-http": ^0.222.0
  "@opentelemetry/instrumentation": ^0.222.0
  "@opentelemetry/instrumentation-aws-sdk": ^0.77.0
  "@opentelemetry/instrumentation-http": ^0.222.0
  "@opentelemetry/instrumentation-undici": ^0.32.0
  "@opentelemetry/otlp-exporter-base": ^0.222.0
  "@opentelemetry/resource-detector-aws": ^2.22.0
  "@opentelemetry/resources": ^2.11.0
  "@opentelemetry/sdk-trace-base": ^2.11.0
  "@opentelemetry/sdk-trace-node": ^2.11.0
  "@opentelemetry/semantic-conventions": ^1.43.0
  tsx: ^4.23.15
  "@types/aws-lambda": ^8.10.163
  "@types/node": ^26.6.4
  typescript: ^7.0.2
  vitest: ^5.0.5
  yaml: ^2.9.1
  zod: ^4.6.7

overrides:
  # @gomomento/sdk 1.118.1, still the latest, pins @grpc/grpc-js 1.13.5, which
  # GHSA advisories fix in 1.13.6. Drop this once the SDK moves past 1.13.5.
  "@gomomento/sdk>@grpc/grpc-js": 1.13.6
  # cdktn-cli 0.25.0, still the latest, asks for glob ^13 through @cdktn/hcl2cdk and
  # @cdktn/provider-generator, and glob 13 has no fix for GHSA-3g3m-2fjr-6pw4. glob 14
  # brings minimatch 11, which fixes GHSA-g3hv-75wg-m249. Drop this once cdktn allows glob 14.
  glob: ^14.0.3

peerDependencyRules:
  allowedVersions:
    # The same exact pin, as a peer of the SDK's generated types.
    "@gomomento/generated-types>@grpc/grpc-js": 1.13.6

allowBuilds:
  esbuild: true
  # Its postinstall only checks versions for the optional protobufjs CLI;
  # nothing that loads protobufjs at runtime depends on it.
  protobufjs: false

minimumReleaseAge: 4320
minimumReleaseAgeStrict: true

# mise owns the package-manager binary.
pmOnFail: ignore
